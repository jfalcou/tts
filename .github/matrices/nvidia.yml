## Read by copacabana's matrix.yml: the rows below are the nvidia jobs, one per row and configuration.
runs-on: self-hosted
rows:
  - { preset: "clang-cuda"  , args: "-DTTS_BENCHMARKS=ON" }
  - { preset: "nvcc"        , args: "-DTTS_BENCHMARKS=ON" }
  - { preset: "nvc++"       , args: "-DTTS_BENCHMARKS=ON", setup: "./.github/scripts/cuda.sh" }
  - { preset: "nvcc-g++"    , args: "-DTTS_BENCHMARKS=ON" }
  - { preset: "nvcc-clang++", args: "-DTTS_BENCHMARKS=ON" }

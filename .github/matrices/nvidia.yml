## Read by copacabana's matrix.yml: the rows below are the nvidia jobs, one per row and configuration.
runs-on: self-hosted
rows:
  - { preset: "clang-cuda"                                }
  - { preset: "nvcc"                                      }
  - { preset: "nvc++", setup: "./.github/scripts/cuda.sh" }
  - { preset: "nvcc-g++"                                  }
  - { preset: "nvcc-clang++"                              }

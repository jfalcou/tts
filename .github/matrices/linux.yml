## Read by copacabana's matrix.yml: the rows below are the linux jobs, one per row and configuration.
runs-on: ubuntu-latest
memcheck: true
rows:
  - { name: "gcc"           , preset: "gcc"           , image: "v11"    , args: "-DTTS_BENCHMARKS=ON" }
  - { name: "clang"         , preset: "clang"         , image: "v11"    , args: "-DTTS_BENCHMARKS=ON" }
  - { name: "clang libc++"  , preset: "clang-libc++"  , image: "v11"    , args: "-DTTS_BENCHMARKS=ON" }
  - { name: "gcc16"         , preset: "gcc"           , image: "v11"    , args: "-DTTS_BENCHMARKS=ON", setup: "./.github/scripts/g++-16.sh"  }
  - { name: "icpx"          , preset: "icpx"          , image: "sycl-v1", args: "-DTTS_BENCHMARKS=ON", setup: "/opt/intel/oneapi/setvars.sh", memcheck: false }
  - { name: "wasm"          , preset: "wasm"          , image: "v11"    , args: "-DTTS_BENCHMARKS=ON", wrapper: "emcmake" }

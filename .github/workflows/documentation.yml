name: TTS Documentation Generation
on:
  push:
    branches:
      - main
  ## Builds nothing to deploy here: it reports what Doxygen said while generating the pages.
  pull_request:
    branches:
      - main
  ## Rebuilds and redeploys the published site without a commit, for when a push skipped this workflow.
  workflow_dispatch:

jobs:
  documentation:
    permissions:
      contents: write
    uses: jfalcou/copacabana/.github/workflows/documentation.yml@main
    with:
      project: tts
      image: ghcr.io/jfalcou/compilers:v11
      deploy-options: -DTTS_BENCHMARK_DOCUMENTATION=ON
      coverage: true

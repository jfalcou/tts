## What every test unit costs to compile: a push to main leaves the reference, a pull request reports the delta.
name: TTS Compile Cost
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: tts-compile-cost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-cost:
    ## Reading the reference off another run asks more than the contents scope the token defaults to, and keeping the
    ## series asks for a write: the job that publishes it is the only one that uses it.
    permissions:
      actions: read
      contents: write
    uses: jfalcou/copacabana/.github/workflows/compile-cost.yml@main
    with:
      project: tts
      series: true
      exclude: '^unit\.doc\.'

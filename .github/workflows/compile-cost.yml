## What every test unit costs to compile: a push to main leaves the reference, a pull request reports the delta.
name: TTS Compile Cost
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: tts-compile-cost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-cost:
    ## Reading the reference off another run asks more than the contents scope the token defaults to.
    permissions:
      actions: read
      contents: read
    uses: jfalcou/copacabana/.github/workflows/compile-cost.yml@47bf63947ce5d46e3e4a1845dab6b10f403464d5 # feat/hosted-matrix
    with:
      project: tts

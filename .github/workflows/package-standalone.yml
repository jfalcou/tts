name: TTS Standalone Generation
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-standalone:
    permissions:
      contents: write
      pull-requests: write
    uses: jfalcou/copacabana/.github/workflows/package-standalone.yml@e96014671dfb262482346ddcaa3a1a810b3eebaf
    with:
      project: tts
      image: ghcr.io/jfalcou/compilers:v11

# CPM is vendored upstream code, in both copies, and our style has no business rewriting it
exclude: ^doc/.*|^cmake/CPM\.cmake$|^test/integration/cpm-test/cpm\.cmake$

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v23.1.5
  hooks:
  - id: clang-format
    types_or: [c++]
- repo: https://github.com/cheshirekow/cmake-format-precommit
  rev: v0.6.13
  hooks:
  - id: cmake-format
  - id: cmake-lint
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.4
  hooks:
  - id: ruff-check
    # The copy of the template's .cmake-format.py runs inside cmake-format, which defines section().
    exclude: ^\.cmake-format\.py$
    # C416 asks for dict(pairs) where SonarCloud S7500 asks for the comprehension it would replace.
    args: ["--select=E,F,W,I,C4,C90,PERF,SIM,UP,B,PLW,Q", "--ignore=C416", "--line-length=120",
           "--config=lint.mccabe.max-complexity=15"]

exclude: ^doc/.*

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v23.1.2
  hooks:
  - id: clang-format
    types_or: [c++]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
  - id: ruff-check
    # C416 asks for dict(pairs) where SonarCloud S7500 asks for the comprehension it would replace.
    args: ["--select=E,F,W,I,C4,C90,PERF,SIM", "--ignore=C416", "--line-length=120",
           "--config=lint.mccabe.max-complexity=15"]
